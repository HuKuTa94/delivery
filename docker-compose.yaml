# The dev stand. Compose prefixes containers, the network and volumes with the project name, so the same file runs
# as another, isolated stand under another name (`-p ...`) with volumes of its own
name: delivery

volumes:
  postgres_data:
  kafka_data:

services:
  # Credentials and database match the datasource of application.yml, so the app only needs another host
  postgres:
    image: postgres:15.3
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: username
      POSTGRES_PASSWORD: secret
    # pg_stat_statements: statistics of every SQL statement, read by postgres-exporter;
    # log_lock_waits + deadlock_timeout: the log names every lock wait longer than 200 ms with its statements
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates the pg_stat_statements extension and the role of postgres-exporter (docker/monitoring/postgres/init.sql),
  # then exits. It runs on every `up`, so a volume made before them gets them too
  postgres-init:
    image: postgres:15.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: secret
    volumes:
      - ./docker/monitoring/postgres/init.sql:/init.sql:ro
    command: ["psql", "-h", "postgres", "-U", "username", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/init.sql"]

  # Single-node KRaft cluster (broker + controller in one process, no ZooKeeper).
  # OUTSIDE (localhost:9092) is for clients on the host, e.g. the app started from the IDE with application.yml;
  # INSIDE (kafka:29092) is for containers of this compose network.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: L0ZEQh1yTbGhNNUE7-6wSQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      # Topics are created explicitly by kafka-init
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Creates the topics of the app once the broker is up, then exits
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in order.status.changed basket.confirmed; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 1 --replication-factor 1
        done
        kafka-topics --bootstrap-server kafka:29092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: delivery
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8081:8080"

  app:
    # One image for every stand: without `image` Compose names the built image after the project
    # (delivery-app, <other project>-app) and every stand builds a copy of its own
    image: delivery-app:latest
    build:
      context: .
      dockerfile: docker/dev/app/Dockerfile.tasks
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    # Healthy once Actuator reports UP, so `up --wait` returns only when the app has started (Liquibase included)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Monitoring of the stand (http://localhost:9090), configs in docker/monitoring.
  # Scrapes /actuator/prometheus of the app every 5 s; the metrics live as long as the stand's volumes
  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Postgres statistics for Prometheus: connections by state, transactions, locks, table scans, the longest
  # transaction and the costliest statements of the app (pg_stat_statements with their text, its own left out)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:exporter@postgres:5432/postgres?sslmode=disable
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
      # Long enough for the WHERE clause after the column list of an ORM select
      - --collector.stat_statements.query_length=300
      - --collector.stat_statements.exclude_users=exporter

  # Kafka statistics for Prometheus: messages written per topic and the lag of every consumer group, i.e. how many
  # messages of a topic the group has not read yet (basket.confirmed for basket-consumer-group of the app)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - --kafka.server=kafka:29092
      # cp-kafka 7.6 is Apache Kafka 3.6
      - --kafka.version=3.6.0
      # Leaves out the internal topics (__consumer_offsets)
      - --topic.filter=^[^_].*

  # Dashboards of the stand, http://localhost:3000: Delivery > Delivery under load. They open without a login
  # (Grafana lets an anonymous user only view); to edit or explore, sign in as admin / admin (a local stand only)
  grafana:
    image: grafana/grafana:13.3.2
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./docker/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
