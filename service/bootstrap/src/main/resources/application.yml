delivery:
  # spring-jpa | ktorm | inmemory
  orm: spring-jpa
  # grpc | in-memory (in-memory answers any street with a random valid location, no Geo service needed)
  geo-location: in-memory
  relay:
    # Delay between two runs of the inbox and of the outbox relay.
    poll-interval: 1s
    # Number of inbox/outbox messages fetched and processed per batch, one transaction per batch.
    batch-size: 50
    # A run takes the next batch at once while the last one was full and fully processed, at most this many batches,
    # so a run under a constant backlog still ends.
    max-batches-per-run: 20
    # Timeout of the transaction of one batch (order creation calls the Geo service in it).
    transaction-timeout: 5s

  cors:
    allowed-origins:
      - http://localhost:8086
    allowed-methods:
      - GET
      - POST

  grpc:
    geo:
      address: localhost
      port: 8084

server:
  port: 8080

# Actuator over HTTP exposes only /actuator/health (the healthcheck of the app in docker-compose.yaml):
# it answers once the application has started and is DOWN while the database is unreachable
management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  application:
    name: delivery application

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: username
    password: secret
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET SESSION idle_in_transaction_session_timeout = '10000'"

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.UUIDSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        max.block.ms: 5000
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 7000