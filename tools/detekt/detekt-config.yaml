style:
  NewLineAtEndOfFile:
    active: false
  ReturnCount:
    max: 4
  AlsoCouldBeApply:
    active: true
  CanBeNonNullable:
    active: true
  ClassOrdering:
    active: true
  AbstractClassCanBeConcreteClass:
    active: false
  AbstractClassCanBeInterface:
    active: false

ktlint:
  FinalNewline:
    active: false
  Indentation:
    active: false
  ImportOrdering:
    active: false
  Wrapping:
    active: false
  NoEmptyFirstLineInMethodBlock:
    active: false
  FunctionReturnTypeSpacing:
    active: false
  BlankLineBetweenWhenConditions:
    active: false
  ClassSignature:
    active: false
  FunctionExpressionBody:
    active: false
  FunctionSignature:
    active: false
  SpacingAroundSquareBrackets:
    active: false
  StatementWrapping:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false

complexity:
  CognitiveComplexMethod:
    active: true
    allowedComplexity: 4
  LongParameterList:
    allowedFunctionParameters: 9
    allowedConstructorParameters: 9

performance:
  SpreadOperator:
    active: false

naming:
  ConstructorParameterNaming:
    active: true
    privateParameterPattern: '[_a-z][A-Za-z0-9]*'

comments:
  active: true
  OutdatedDocumentation:
    active: true
    matchTypeParameters: true
    matchDeclarationsOrder: true
    allowParamOnConstructorProperties: false