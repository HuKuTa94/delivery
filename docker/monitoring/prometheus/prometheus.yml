# Prometheus of docker-compose.yaml: scrapes the app and the exporters of its own stand
global:
  # Fine enough to see a load test ramp up (Gatling ramps for 10 s)
  scrape_interval: 5s

scrape_configs:
  - job_name: delivery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
